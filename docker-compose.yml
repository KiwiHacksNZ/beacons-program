services:
  beacons:
    build:
      context: .
      dockerfile: Dockerfile
    image: kiwihacks/beacons:local
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HEALTHCHECK_SECRET: ${HEALTHCHECK_SECRET}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
      PUBLIC_SITE_ORIGINS: ${PUBLIC_SITE_ORIGINS}
      ADMIN_TITLE: ${ADMIN_TITLE:-KiwiHacks Beacons}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/internal/health/db',
          {headers:{authorization:'Bearer '+process.env.HEALTHCHECK_SECRET}})
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
