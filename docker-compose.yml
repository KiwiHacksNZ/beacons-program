services:
  beacons:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      NOCODB_URL: ${NOCODB_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      NOCODB_PROJECT_ID: ${NOCODB_PROJECT_ID}
      LOOPS_API_KEY: ${LOOPS_API_KEY}
      HEALTHCHECK_SECRET: ${HEALTHCHECK_SECRET}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS}
      PUBLIC_SITE_ORIGINS: ${PUBLIC_SITE_ORIGINS}
      LEADERBOARD_CACHE_TTL_MS: ${LEADERBOARD_CACHE_TTL_MS:-30000}
      ADMIN_TITLE: ${ADMIN_TITLE:-KiwiHacks Beacons}
      DEBUG_LOGS: ${DEBUG_LOGS:-false}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/live')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s
